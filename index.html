<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1b1410;font-family:Inter,sans-serif;color:#f3e6d3}
#c{position:fixed;inset:0;display:block;touch-action:none}
button{font-family:inherit}
.glass{background:#211813e6;border:1px solid #5a4330;backdrop-filter:blur(8px);box-shadow:0 10px 40px #0006}
header{position:fixed;top:14px;left:18px;z-index:3;display:flex;flex-direction:column;gap:8px;pointer-events:none}
header h1{font-family:Cinzel,serif;font-size:26px;letter-spacing:.06em;color:#f6d9a4;text-shadow:0 2px 12px #000a}
header p{font-size:13px;opacity:.85;text-shadow:0 1px 6px #000a}
#models{display:flex;gap:6px;pointer-events:auto}
.pill{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:#2a1f18dd;border:1px solid #5a4330;font-size:12.5px;font-weight:500;transition:.2s;white-space:nowrap}
.pill:hover{background:#3d2c20}
.pill.on{background:#c98a3e;color:#1b1410;border-color:#f6d9a4;font-weight:600}
#levels{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;gap:6px}
#levels .pill{border-radius:10px;padding:9px 14px;min-width:178px;font-size:13px}
#levels .pill span{display:inline-block;width:22px;font-family:Cinzel,serif;font-weight:700}
#panel{position:fixed;right:18px;top:18px;bottom:78px;width:min(400px,calc(100vw - 36px));z-index:3;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
#panel.hide{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 8px;border-bottom:1px solid #4a372a}
.tab{all:unset;cursor:pointer;font-size:12px;padding:6px 9px;border-radius:8px;opacity:.8}
.tab:hover{background:#3a2a1f;opacity:1}
.tab.on{background:#c98a3e;color:#1b1410;opacity:1;font-weight:600}
#collapse{margin-left:auto}
#pbody{padding:18px 20px 22px;overflow:auto;flex:1}
#pbody .tag{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#c98a3e;font-weight:600}
#pbody h2{font-family:Cinzel,serif;font-size:21px;color:#f6d9a4;margin:6px 0 12px}
#pbody h3{font-family:Cinzel,serif;font-size:16px;color:#f6d9a4;margin:14px 0 8px}
#pbody p{font-size:14px;line-height:1.6;margin-bottom:10px;opacity:.93}
#pbody ul{margin:4px 0 12px 18px;font-size:14px;line-height:1.6}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.facts div{background:#2f231a;border-radius:10px;padding:8px 10px}
.facts b{display:block;font-size:16px;color:#f6d9a4}
.facts small{font-size:11px;opacity:.7}
.note{font-size:12px!important;opacity:.65!important}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 12px}
th,td{border-bottom:1px solid #4a372a;padding:7px 6px;text-align:left;vertical-align:top;line-height:1.45}
th{color:#f6d9a4;font-weight:600}
td:first-child{color:#c98a3e;font-weight:600;white-space:nowrap}
.tl{border-left:2px solid #c98a3e;margin:6px 0 0 6px;padding-left:14px}
.tl div{position:relative;margin-bottom:14px;font-size:13.5px;line-height:1.5}
.tl div:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:#f6d9a4;border:2px solid #c98a3e}
.tl b{color:#f6d9a4;display:block}
.q{background:#2a1f18;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.q p{margin-bottom:6px!important}
.q label{display:block;font-size:13.5px;padding:5px 8px;border-radius:7px;cursor:pointer}
.q label:hover{background:#3a2a1f}
.q label.ok{background:#3c6b35}
.q label.bad{background:#7a2f2a}
.btn{all:unset;cursor:pointer;background:#c98a3e;color:#1b1410;font-weight:600;padding:9px 16px;border-radius:10px;font-size:14px}
.score{font-family:Cinzel,serif;font-size:24px;color:#f6d9a4;margin-top:12px}
#openPanel{position:fixed;right:18px;top:18px;z-index:3;display:none}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
#pres{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:none;align-items:center;gap:10px;padding:8px 10px;border-radius:999px}
#pres .t{font-size:13px;min-width:170px;text-align:center}
#pres .t b{font-family:Cinzel,serif;color:#f6d9a4}
#legend{position:fixed;left:18px;bottom:70px;z-index:3;border-radius:12px;padding:10px 12px;font-size:12px;display:none}
#legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
#legend i{width:16px;height:12px;border-radius:3px;display:inline-block}
#hint{position:fixed;left:18px;bottom:20px;font-size:12px;opacity:.65;z-index:2;text-shadow:0 1px 4px #000}
#modal{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{max-width:min(900px,96vw);max-height:92vh;overflow:auto;border-radius:16px;padding:18px;position:relative}
#modal img{max-width:100%;border-radius:10px;display:block;margin:10px 0}
#modal .x{position:absolute;right:10px;top:8px}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#211813cc;border:1px solid #c98a3e;white-space:nowrap;cursor:pointer;pointer-events:auto}
.lbl.on{background:#c98a3e;color:#1b1410}
.lbl.human{border-color:#7fb3e0}
@media (max-width:820px){
  #levels{top:auto;bottom:auto;top:112px;transform:none;flex-direction:row;flex-wrap:wrap;left:10px;right:10px}
  #levels .pill{min-width:0;padding:6px 9px;font-size:11.5px}
  #levels .pill span{width:auto;margin-right:4px}
  #panel{top:auto;bottom:118px;height:36vh;right:10px;left:10px;width:auto}
  #openPanel{top:auto;bottom:118px;right:10px}
  #hint{display:none}
  header{left:10px;top:10px}
  header h1{font-size:19px}
  #bar .pill{padding:6px 9px;font-size:11.5px}
  #legend{bottom:auto;top:200px;left:10px}
}
</style>
</head>

  <button class="pill" id="pExit">✕</button>
</div>
<div id="hint">Sürükle: döndür · Sağ tık/iki parmak: kaydır · Tekerlek: yakınlaş · Kata tıkla: bilgi</div>

<script>
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=k=>1-Math.pow(1-k,3);
const easeIO=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

/* =================== İÇERİK =================== */
const UR_INFO={
 genel:{no:'◆',name:'Genel Bakış',tag:'Zigurat nedir?',html:`
  <p>Zigurat, Mezopotamya'da (bugünkü Irak) yapılan, üst üste küçülen <b>teraslardan</b> oluşan basamaklı tapınak kulesidir. Kelime Akadca <i>ziqqurratu</i> — "yüksek yer, zirve" anlamına gelir.</p>
  <p>Bu model en iyi korunmuş örnek olan <b>Ur Zigguratı</b>'nı esas alır. Sümercesi <b>Etemenniğuru</b>'dur (yaklaşık "dehşet saçan temelin evi"). Ur'un 3. Hanedanı kralı <b>Ur-Nammu</b> başlatmış, oğlu <b>Şulgi</b> tamamlamıştır. Ay tanrısı <b>Nanna (Sin)</b>'ya adanmıştır.</p>
  <div class="facts"><div><b>~64 × 46 m</b><small>Taban</small></div><div><b>~30 m</b><small>Tahmini yükseklik</small></div><div><b>3 teras</b><small>+ tepe tapınağı</small></div><div><b>Kerpiç</b><small>Çekirdek malzeme</small></div></div>
  <p>Ziguratın içinde oda yoktur; <b>masif</b> bir yapıdır (içini görmek için <b>✂ Kesit</b> düğmesine bas). Tanrıyı göğe yaklaştıran yapay bir "dağ" olarak düşünülmüştür. Halk tepeye çıkamaz, yalnızca rahipler çıkabilirdi.</p>
  <p class="note">Üst katlar günümüze ulaşmadığı için ölçüleri arkeolojik yeniden yapılandırmaya dayanan tahminlerdir.</p>`},
 temel:{no:'0',name:'Temel ve Avlu',tag:'Zemin',html:`
  <p>Zigurat, kutsal alanı çevreleyen duvarlı bir <b>avlu (temenos)</b> içinde, yükseltilmiş bir platform üzerine oturur.</p>
  <ul><li>Kutsal alan şehirden kalın duvarlarla ayrılırdı.</li><li>Avluda <b>depolar, rahip konutları, mutfaklar</b> ve küçük tapınaklar vardı.</li><li>Yapının köşeleri ana yönlere (K-G-D-B) bakar.</li><li>Şehir <b>Fırat</b> nehrinin kıyısındaydı; çevresi hurma bahçeleriyle kaplıydı.</li></ul>
  <p>Bölgede taş az olduğu için temel de dahil her şey <b>kil ve tuğladan</b> yapılmıştır.</p>`},
 k1:{no:'1',name:'1. Teras (Ana Gövde)',tag:'Birinci kat',html:`
  <p>En büyük ve bugün en iyi korunmuş kattır. Yapının kütlesinin çoğunu oluşturur.</p>
  <div class="facts"><div><b>~64 × 46 m</b><small>Taban</small></div><div><b>~11 m</b><small>Yükseklik</small></div></div>
  <ul><li><b>Çekirdek:</b> güneşte kurutulmuş kerpiç.</li><li><b>Dış kaplama:</b> ~2,5 m kalınlığında, <b>bitümle (zift)</b> örülmüş pişmiş tuğla; yağmura karşı korur.</li><li><b>Kamış hasır katmanları:</b> kerpiç sıraları arasına serilir, yapıyı birbirine bağlar.</li><li><b>Drenaj delikleri:</b> içteki nemin dışarı çıkmasını sağlar.</li><li><b>Payandalar:</b> duvarı bölen dikey çıkıntılar; hem süs hem destek.</li><li>Duvarlar <b>içe eğimlidir</b>; yapıyı sağlamlaştırır ve daha yüksek gösterir.</li></ul>`},
 merdiven:{no:'⇡',name:'Merdivenler',tag:'Çıkış yolu',html:`
  <p>Ön (kuzeydoğu) cephede <b>üç anıtsal merdiven</b> vardır:</p>
  <ul><li><b>Orta merdiven</b> cepheye dik uzanır.</li><li><b>İki yan merdiven</b> duvara paralel yükselir.</li><li>Her biri yaklaşık <b>100 basamaklıdır</b>.</li><li>Üçü birinci terasın üstündeki <b>kapı yapısında</b> birleşir.</li></ul>
  <p>Merdivenler, tören alaylarının tanrıya doğru "yükselişini" simgeler (<b>🚶 Rahip Alayı</b> düğmesine bas). Kapıdan sonra daha dar merdivenler üst katlara çıkar.</p>`},
 k2:{no:'2',name:'2. Teras',tag:'İkinci kat',html:`
  <p>Birinci terasın üzerine, kenarlardan geri çekilerek oturtulmuş daha küçük bir teras. Böylece etrafında yürünebilen bir <b>gezinti alanı</b> kalır.</p>
  <ul><li>Birinci kattan daha alçak ve dar.</li><li>Aynı tuğla kaplama ve eğimli duvar tekniği kullanılmıştır.</li><li>Teraslarda <b>ağaç ve bitkiler</b> olduğu düşünülür ("dağ" fikri).</li></ul>
  <p class="note">Bu kat bugün büyük ölçüde yıkıktır. Görünüm, Leonard Woolley'nin 1922–1934 kazılarına dayanan yeniden yapılandırmadır.</p>`},
 k3:{no:'3',name:'3. Teras',tag:'Üçüncü kat',html:`
  <p>Tapınağı taşıyan en küçük teras. Yüksekliği sayesinde şehrin her yerinden ve düz ovadan kilometrelerce öteden görülebilirdi.</p>
  <ul><li>Yalnızca rahiplerin girebildiği alan.</li><li>Tepe tapınağına çıkan son merdiven buradadır.</li><li>Ziguratın "basamaklı dağ" silüetini tamamlar.</li></ul>`},
 tapinak:{no:'▲',name:'Tepe Tapınağı',tag:'Zirve',html:`
  <p>En üstte ay tanrısı <b>Nanna</b>'ya adanmış küçük bir <b>tapınak</b> bulunurdu.</p>
  <ul><li>Tanrının yeryüzüne indiği ve dinlendiği yer sayılırdı.</li><li>Rahipler burada ritüel yapar ve sunu sunardı.</li><li>Ayın hareketlerini izlemek için de kullanılmış olabilir.</li><li>Bu kısım günümüze ulaşmamıştır.</li></ul>
  <p><b>Piramitten farkı:</b> piramit bir <b>mezardır</b> ve sivri biter. Zigurat ise bir <b>tapınak kaidesidir</b>; düz terasları ve tepesinde tapınağı vardır. Ayrıntılar <b>Karşılaştır</b> sekmesinde.</p>`}
};
const BABIL_INFO={
 genel:{no:'◆',name:'Genel Bakış',tag:'Etemenanki',html:`
  <p><b>Etemenanki</b> ("gök ile yerin temel platformu evi"), Babil'in baş tanrısı <b>Marduk</b>'a adanmış dev zigurattır. Son halini MÖ 7.–6. yüzyılda <b>Nabopolassar</b> ve oğlu <b>II. Nebukadnezar</b> vermiştir.</p>
  <div class="facts"><div><b>~91 × 91 m</b><small>Kare taban</small></div><div><b>~91 m</b><small>Tahmini yükseklik</small></div><div><b>7 kat</b><small>Tapınak dahil</small></div><div><b>Marduk</b><small>Adandığı tanrı</small></div></div>
  <p>Ölçüler, katların boyutlarını veren <b>Esagila tableti</b> adlı çivi yazılı metne dayanır. Tevrat'taki <b>Babil Kulesi</b> anlatısının bu yapıdan esinlendiği düşünülür.</p>
  <p class="note">Bugün yalnızca temelinin izi kalmıştır; model, tablet ve kazı verilerine dayanan bir tahmindir.</p>`},
 temel:{no:'0',name:'Temel ve Avlu',tag:'Zemin',html:`
  <p>Zigurat, duvarlarla çevrili dev bir kutsal avlunun ortasında duruyordu. Avlunun çevresinde rahip odaları ve depolar vardı.</p>
  <ul><li>Hemen güneyinde Marduk'un ana tapınağı <b>Esagila</b> bulunuyordu.</li><li>Yapı, Fırat nehri kıyısındaki şehrin tam merkezindeydi.</li></ul>`},
 k1:{no:'1',name:'1. Kat',tag:'Ana gövde',html:`
  <div class="facts"><div><b>~91 × 91 m</b><small>Taban</small></div><div><b>~33 m</b><small>Yükseklik</small></div></div>
  <ul><li>Kerpiç çekirdeği, yaklaşık <b>15 m kalınlığında</b> bir pişmiş tuğla kaplama sarar.</li><li>Duvarlar Ur'a göre çok daha diktir ve dikey <b>nişler/payandalarla</b> bölünmüştür.</li><li>Tek başına 10 katlı bir apartman yüksekliğindedir.</li></ul>`},
 merdiven:{no:'⇡',name:'Merdivenler',tag:'Çıkış yolu',html:`
  <p>Güney cephede, Ur'daki gibi <b>üç merdivenli</b> bir düzen olduğu düşünülür: uzun bir orta merdiven ve iki yan merdiven.</p>
  <p>Merdivenler birinci katın üstünde birleşir, oradan dar merdivenler ve rampalarla üst katlara çıkılırdı.</p>`},
 k2:{no:'2',name:'2. Kat',tag:'İkinci kat',html:`
  <div class="facts"><div><b>~78 × 78 m</b><small>Taban</small></div><div><b>~18 m</b><small>Yükseklik</small></div></div>
  <p>İkinci büyük kütle. Birinci katın üstünde geniş bir teras bırakacak şekilde geri çekilmiştir.</p>`},
 ust:{no:'3–6',name:'3.–6. Katlar',tag:'Üst katlar',html:`
  <p>Dört alçak kat, her biri yaklaşık <b>6 m</b> yüksekliğindedir ve yukarı çıktıkça küçülür:</p>
  <ul><li>3. kat: ~60 × 60 m</li><li>4. kat: ~51 × 51 m</li><li>5. kat: ~42 × 42 m</li><li>6. kat: ~33 × 33 m</li></ul>
  <p>Bazı yeniden yapılandırmalarda katların farklı renklere boyandığı düşünülür.</p>`},
 tapinak:{no:'7',name:'7. Kat — Tapınak',tag:'Zirve',html:`
  <div class="facts"><div><b>~24 × 21 m</b><small>Taban</small></div><div><b>~15 m</b><small>Yükseklik</small></div></div>
  <p>En üstte Marduk'un kutsal odası vardı. Antik Yunan tarihçisi <b>Herodot</b> (MÖ 5. yy), tepedeki tapınakta büyük bir yatak ve altın bir masa bulunduğunu anlatır.</p>
  <p>Babil'in İştar Kapısı'ndaki gibi <b>mavi sırlı tuğlalarla</b> kaplı olduğu düşünülür.</p>`}
};

function brickTex(base,mortar,rep){
 const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
 g.fillStyle=mortar;g.fillRect(0,0,256,256);const bh=16,bw=48;
 for(let y=0;y<256;y+=bh){const off=(y/bh)%2?bw/2:0;for(let x=-bw;x<256+bw;x+=bw){g.fillStyle=shade(base,(Math.random()*26-13)|0);g.fillRect(x+off+1,y+1,bw-2,bh-2);}}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);return t;
}
function shade(hex,v){const n=parseInt(hex.slice(1),16);const f=x=>clamp(x+v,0,255);return`rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`}

const S={root:null,groups:{},order:[],sections:[],labels:[],torches:[],focus:{},proc:null,human:null,path:null};
function frustum(w,d,h,inset){
 const g=new THREE.BoxGeometry(w,h,d);const p=g.attributes.position;
 for(let i=0;i<p.count;i++)if(p.getY(i)>0){p.setX(i,p.getX(i)*(w-2*inset)/w);p.setZ(i,p.getZ(i)*(d-2*inset)/d);}
 g.translate(0,h/2,0);g.computeVertexNormals();return g;
}
function grp(id){const g=new THREE.Group();g.userData.gid=id;S.root.add(g);S.groups[id]=g;S.order.push(id);return g;}
function mesh(geo,mat,g){const m=new THREE.Mesh(geo,mat);m.castShadow=m.receiveShadow=true;m.userData.part=true;m.userData.gid=g.userData.gid;g.add(m);return m;}
function box(g,mat,w,h,d,x,y,z){const m=mesh(new THREE.BoxGeometry(w,h,d),mat,g);m.position.set(x,y+h/2,z);return m;}

// Kesik piramit kat + üst yüzey + payandalar + kesit
function level(g,o){
 const {w,d,h,inset,y,z=0,mat,shell=2,step=6,faces='fblr',holes=true}=o;
 mesh(frustum(w,d,h,inset),mat,g).position.set(0,y,z);
 box(g,MAT.top,w-2*inset,0.15,d-2*inset,0,y+h-0.05,z);
 const ang=Math.atan(inset/h);
 const gx=new THREE.BoxGeometry(1.8,h,1);gx.translate(0,h/2,0);
 const gz=new THREE.BoxGeometry(1,h,1.8);gz.translate(0,h/2,0);
 for(const s of [1,-1]){
  if(faces.includes(s>0?'f':'b')){const n=Math.round(w/step);for(let i=1;i<n;i++){const m=mesh(gx,mat,g);m.position.set(-w/2+i*w/n,y,z+s*d/2);m.rotation.x=-s*ang;}}
  if(faces.includes(s>0?'r':'l')){const n=Math.round(d/step);for(let i=1;i<n;i++){const m=mesh(gz,mat,g);m.position.set(s*w/2,y,z-d/2+i*d/n);m.rotation.z=s*ang;}}
 }
 if(holes){ // drenaj delikleri (arka cephe)
  const hg=new THREE.BoxGeometry(.5,.5,.3);
  for(let r=1;r<=Math.floor(h/3.2);r++){const yy=y+r*3,ins=inset*(yy-y)/h;const n=Math.round(w/step);
   for(let i=0;i<n;i++){const m=new THREE.Mesh(hg,MAT.dark);m.userData.part=true;m.userData.gid=g.userData.gid;m.position.set(-w/2+(i+.5)*w/n,yy,z-(d/2-ins)-.05);g.add(m);}}
 }
 section(g,{d,h,inset,y,z,shell});
}
// Kesit yüzü (x=0 düzleminde, +x'e bakar)
function trap(z,d,h,inset,y){const s=new THREE.Shape();s.moveTo(-(z-d/2),y);s.lineTo(-(z+d/2),y);s.lineTo(-(z+d/2-inset),y+h);s.lineTo(-(z-d/2+inset),y+h);s.closePath();return s;}
function section(g,{d,h,inset,y,z,shell}){
 const sg=new THREE.Group();sg.userData.gid=g.userData.gid;sg.visible=false;g.add(sg);S.sections.push(sg);
 const add=(geo,mat,x)=>{const m=new THREE.Mesh(geo,mat);m.rotation.y=Math.PI/2;m.position.x=x;m.userData.part=true;m.userData.gid=g.userData.gid;sg.add(m);return m;};
 const sh=add(new THREE.ShapeGeometry(trap(z,d,h,inset,y)),SEC.shell,.03);
 // UV ölçeği
 const uv=sh.geometry.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)/6,uv.getY(i)/2);
 if(!shell)return;
 const hin=Math.max(.5,h-Math.min(shell*.5,1.2)),din=d-2*shell,iin=inset*hin/h;
 add(new THREE.ShapeGeometry(trap(z,din,hin,iin,y)),SEC.core,.06);
 for(let yy=y+1.4;yy<y+hin-.3;yy+=1.6){const wd=din-2*iin*(yy-y)/hin;const m=add(new THREE.PlaneGeometry(wd,.22),SEC.reed,.09);m.position.y=yy;m.position.z=z;}
 // drenaj kanalları (çekirdekten dışa)
 for(let yy=y+2.2;yy<y+hin-1;yy+=3.2){const len=shell+1.5;[-1,1].forEach(s=>{const wd=din-2*iin*(yy-y)/hin;const m=add(new THREE.PlaneGeometry(len,.35),SEC.drain,.1);m.position.set(.1,yy,z+s*(wd/2+len/2-1.5));});}
}
function stair(g,{n,len,width,h,y,dir,sx,sz,mat=MAT.stair,rails=true}){
 const sl=len/n,sh=h/n;
 for(let i=0;i<n;i++){
  const hh=sh*(i+1);const cx=sx+(dir==='x+'?sl*(i+.5):dir==='x-'?-sl*(i+.5):0);const cz=sz+(dir==='z-'?-sl*(i+.5):0);
  const along=dir[0]==='x';
  box(g,mat,along?sl:width,hh,along?width:sl,cx,y,cz);
  if(rails&&i%2===0)[-1,1].forEach(s=>box(g,MAT.brick1,along?sl*2:.7,hh+.8,along?.7:sl*2,cx+(along?0:s*(width/2+.35)),y,cz+(along?s*(width/2+.35):0)));
 }
}
function palm(parent,x,z,s){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);g.rotation.y=Math.random()*6;
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,8,6),ENV.trunk);t.position.y=4;t.rotation.z=.06;t.castShadow=true;g.add(t);
 for(let i=0;i<8;i++){const l=new THREE.Mesh(new THREE.PlaneGeometry(1.1,4.2),ENV.leaf);l.geometry.translate(0,2.1,0);l.position.set(.25,8,0);l.rotation.set(0,i/8*Math.PI*2,0);l.rotateX(1.15+Math.random()*.25);l.castShadow=true;g.add(l);}
 parent.add(g);
}
function person(mat){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.16,.3,1.45,8),mat);b.position.y=.72;b.castShadow=true;g.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),ENV.skin);h.position.y=1.58;h.castShadow=true;g.add(h);
 return g;
}
function torch(x,y,z,range){
 const g=new THREE.Group();g.position.set(x,y,z);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,1.6,6),ENV.trunk);pole.position.y=.8;g.add(pole);
 const f=new THREE.Mesh(new THREE.ConeGeometry(.22,.6,8),ENV.flame);f.position.y=1.85;g.add(f);
 const L=new THREE.PointLight(0xff8a3a,0,range,2);L.position.y=2.2;g.add(L);
 S.root.add(g);S.torches.push({L,f});
}
function label(gid,text,pos,cls=''){S.labels.push({gid,text,pos,cls});}
function proc(points){const p=new THREE.CurvePath();for(let i=0;i<points.length-1;i++)p.add(new THREE.LineCurve3(new THREE.Vector3(...points[i]),new THREE.Vector3(...points[i+1])));S.path=p;}

function buildUr(){
 const B=1.5,H1=11,W1=64,D1=46,F=D1/2;
 // Temel + avlu
 const g0=grp('temel');
 mesh(frustum(124,124,B,.5),MAT.plat,g0).position.set(0,0,8);
 section(g0,{d:124,h:B,inset:.5,y:0,z:8,shell:0});
 const wh=4,wt=1.5;
 box(g0,MAT.plat,124,wh,wt,0,B,-54);
 [-1,1].forEach(s=>{box(g0,MAT.plat,wt,wh,124,s*62,B,8);box(g0,MAT.plat,55,wh,wt,s*34.5,B,70);box(g0,MAT.brick1,5,7,4,s*8,B,70);});
 // avlu yapıları
 [[-48,-32,18,4,26],[48,-32,18,4,26],[-50,24,14,3.5,30],[50,24,14,3.5,30],[0,-46,56,3.2,9],[-40,58,16,3,8],[40,58,16,3,8]].forEach(([x,z,w,h,d])=>{box(g0,MAT.mud,w,h,d,x,B,z);box(g0,MAT.top,w+.4,.3,d+.4,x,B+h,z);});
 // 1. teras
 const g1=grp('k1');
 level(g1,{w:W1,d:D1,h:H1,inset:2.2,y:B,mat:MAT.brick1,shell:2.5,faces:'blr'});
 // merdivenler
 const gS=grp('merdiven');
 stair(gS,{n:40,len:28,width:6.5,h:H1,y:B,dir:'z-',sx:0,sz:F+28});
 stair(gS,{n:36,len:26,width:5,h:H1,y:B,dir:'x+',sx:-30,sz:F+2.6});
 stair(gS,{n:36,len:26,width:5,h:H1,y:B,dir:'x-',sx:30,sz:F+2.6});
 box(gS,MAT.brick2,10,4,7,0,B+H1,F-1);
 box(gS,MAT.top,10.6,.4,7.6,0,B+H1+4,F-1);
 const arch=new THREE.Mesh(new THREE.BoxGeometry(3,3,7.2),MAT.dark);arch.position.set(0,B+H1+1.5,F-1);arch.userData.part=true;arch.userData.gid='merdiven';gS.add(arch);
 // 2. teras
 const Y2=B+H1,H2=6;
 const g2=grp('k2');
 level(g2,{w:44,d:30,h:H2,inset:1.4,y:Y2,z:-3,mat:MAT.brick2,shell:1.5,step:5.5,faces:'fblr'});

 // 3. teras
 const Y3=Y2+H2,H3=5;
 const g3=grp('k3');
 level(g3,{w:26,d:18,h:H3,inset:1,y:Y3,z:-5,mat:MAT.brick3,shell:1.2,step:5,faces:'fblr'});
 stair(g3,{n:10,len:6,width:3,h:H3,y:Y3,dir:'z-',sx:0,sz:8,rails:false});
 // tapınak
 const Y4=Y3+H3;
 const g4=grp('tapinak');
 box(g4,MAT.temple,14,5,9,0,Y4,-6);
 box(g4,MAT.blue,15,.6,10,0,Y4+5,-6);
 for(let i=-3;i<=3;i++)if(i)box(g4,MAT.temple,.8,5,.5,i*2,Y4,-1.4);
 const door=new THREE.Mesh(new THREE.BoxGeometry(2,3.2,.3),MAT.dark);door.position.set(0,Y4+1.6,-1.4);door.userData.part=true;door.userData.gid='tapinak';g4.add(door);
 const cm2=cm({color:0xf4e3a1,emissive:0x6b5a20,metalness:.4,roughness:.3});
 const cres=mesh(new THREE.TorusGeometry(1.1,.22,8,24,Math.PI*1.3),cm2,g4);cres.position.set(0,Y4+7.2,-6);cres.rotation.z=-Math.PI*.15;
 section(g4,{d:9,h:5,inset:0,y:Y4,z:-6,shell:0});
 // bitkiler
 const plant=(g,x,y,z)=>{const t=mesh(new THREE.CylinderGeometry(.15,.2,1.6,6),cm({color:0x6b4a2b}),g);t.position.set(x,y+.8,z);const l=mesh(new THREE.SphereGeometry(1,8,6),cm({color:0x5f7d3a}),g);l.position.set(x,y+2,z);l.scale.y=.8;};
 [[-27,14],[27,14],[-27,-17],[27,-17],[-25,-19.5],[25,-19.5]].forEach(([x,z])=>plant(g1,x,B+H1,z));
 [[-17,-10],[17,-10],[-17,5],[17,5]].forEach(([x,z])=>plant(g2,x,Y2+H2,z));
 // meşaleler

const variants=new Map();
function variant(orig,kind){
 if(kind==='hi'&&!orig.emissive)return orig;
 let v=variants.get(orig);if(!v){v={};variants.set(orig,v);}
 if(!v[kind]){const m=orig.clone();if(orig.clippingPlanes)m.clippingPlanes=[clipPlane];
  if(kind==='hi'){m.emissive=new THREE.Color(0x5a3412);}else{m.transparent=true;m.opacity=.2;m.depthWrite=false;}
  v[kind]=m;}
 return v[kind];
}

 scene.add(S.root);
 const extra=M.build();
 // çevre: palmiyeler, nehir
 envGroup=new THREE.Group();scene.add(envGroup);
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 for(let i=0;i<70;i++){const a=rnd()*Math.PI*2,r=extra.palmR[0]+rnd()*(extra.palmR[1]-extra.palmR[0]);const x=Math.cos(a)*r,z=Math.sin(a)*r;if(z<extra.river+40&&z>extra.river-40)continue;palm(envGroup,x,z,.9+rnd()*.5*M.k);}
 const river=new THREE.Mesh(new THREE.PlaneGeometry(5000,55*M.k),ENV.water);river.rotation.x=-Math.PI/2;river.position.set(0,.08,extra.river);envGroup.add(river);
 // insan ölçeği

 const ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.6,32),new THREE.MeshBasicMaterial({color:0x7fb3e0,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.05;hg.add(ring);
 hg.visible=humanOn;S.root.add(hg);S.human=hg;
 S.labels.push({gid:'_human',text:'🧍 İnsan · 1,7 m',pos:new THREE.Vector3(extra.humanPos[0],extra.humanPos[1]+2.6,extra.humanPos[2]),cls:'human'});

canvas.addEventListener('pointerup',e=>{
 if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
 const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObject(S.root,true).filter(h=>{const o=h.object,m=o.material;return o.userData.part&&shown(o)&&!(m.transparent&&m.opacity<.5)&&!(m.clippingPlanes&&h.point.x>clipPlane.constant+.01);});
 if(hits.length){const id=hits[0].object.userData.gid;select(id===current?'genel':id);}else select('genel');
});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* =================== DÖNGÜ =================== */
const v=new THREE.Vector3(),tan=new THREE.Vector3();
loadModel('ur');
showTab('katlar');
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.1,(now-last)/1000);last=now;const lerp=r=>1-Math.pow(1-r,dt*60);
 // kamera geçişi
 if(tw){const k=easeIO(Math.min(1,(now-tw.s)/tw.d));camera.position.lerpVectors(tw.p0,tw.p1,k);controls.target.lerpVectors(tw.t0,tw.t1,k);if(k>=1)tw=null;}
 // katları ayır + inşa
 ex+=((explode?1:0)-ex)*lerp(.08);if(Math.abs((explode?1:0)-ex)<.002)ex=explode?1:0;
 let building=false;
 S.order.forEach((id,i)=>{const g=S.groups[id];let off=0,vis=true;
  if(buildT!==null){const t=(now-buildT)/1000-i*.9;const k=clamp(t/.9,0,1);vis=t>0;off=(1-easeOut(k))*M.drop;if(k<1)building=true;}
  g.visible=vis;g.position.y=off+(M.ex[id]||0)*ex;});
 if(buildT!==null&&!building)buildT=null;
 // kesit
 cutV+=((cut?1:0)-cutV)*lerp(.06);if(Math.abs((cut?1:0)-cutV)<.003)cutV=cut?1:0;
 clipPlane.constant=cutV<.002?1e4:(1-cutV)*60*M.k;
 const secOn=cutV>.95;S.sections.forEach(s=>s.visible=secOn);
 // alay
 if(procOn&&S.path){const t=now/1000*.018;S.proc.children.forEach(p=>{const u=((t+p.userData.off)%1+1)%1;S.path.getPointAt(u,v);S.path.getTangentAt(u,tan);p.position.copy(v);p.position.y+=Math.sin(now/120+p.userData.off*300)*.04;p.rotation.y=Math.atan2(tan.x,tan.z);});}
 // meşale titremesi
 if(MODES[modeKey].torch)S.torches.forEach((t,i)=>{const f=1+Math.sin(now/90+i*1.7)*.12+Math.sin(now/37+i)*.06;t.f.scale.set(f,f*1.15,f);t.L.intensity=MODES[modeKey].torch*f;});
 controls.update();renderer.render(scene,camera);
 // etiketler
 if(showLabels){const W=innerWidth,H=innerHeight;S.labels.forEach(l=>{
  let ok=true,dy=0;
  if(l.gid==='_human')ok=humanOn;else if(S.groups[l.gid]){ok=S.groups[l.gid].visible;dy=S.groups[l.gid].position.y;}
  v.copy(l.pos);v.y+=dy;v.project(camera);ok=ok&&v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
  l.el.style.display=ok?'':'none';if(ok){l.el.style.left=(v.x+1)/2*W+'px';l.el.style.top=(1-v.y)/2*H+'px';}});}
}
requestAnimationFrame(loop);
</script>
</body>
</html>
